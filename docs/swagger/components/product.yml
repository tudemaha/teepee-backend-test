schemas:
  CreateProductRequest:
    type: object
    required: [name, price, category_ids]
    properties:
      name:
        type: string
        minLength: 2
        example: "iPhone 15 Pro"
      description:
        type: string
        example: "Latest Apple smartphone with titanium build."
      price:
        type: integer
        format: int64
        minimum: 1
        example: 19999000
      stock:
        type: integer
        minimum: 0
        example: 50
      category_ids:
        type: array
        minItems: 1
        items:
          type: string
          format: uuid
        example: ["01927e4b-3c8a-7f11-a1b2-0242ac120002"]
      image_urls:
        type: array
        items:
          type: string
          format: uri
        example: ["https://cdn.example.com/iphone15.jpg"]

  UpdateProductRequest:
    type: object
    required: [name, price, category_ids]
    properties:
      name:
        type: string
        minLength: 2
        example: "iPhone 15 Pro Max"
      description:
        type: string
        example: "Updated description."
      price:
        type: integer
        format: int64
        minimum: 1
        example: 21999000
      stock:
        type: integer
        minimum: 0
        example: 30
      category_ids:
        type: array
        minItems: 1
        items:
          type: string
          format: uuid
        example: ["01927e4b-3c8a-7f11-a1b2-0242ac120002"]

  UpdateProductStockRequest:
    type: object
    required: [stock]
    properties:
      stock:
        type: integer
        minimum: 0
        description: Amount to add to existing stock
        example: 20

  UpdateProductAvailabilityRequest:
    type: object
    required: [available]
    properties:
      available:
        type: boolean
        example: true

  ProductImageResponse:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: "01927e4b-3c8a-7f11-a1b2-0242ac120010"
      url:
        type: string
        format: uri
        example: "https://cdn.example.com/iphone15.jpg"
      is_primary:
        type: boolean
        example: true

  ProductResponse:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: "01927e4b-3c8a-7f11-a1b2-0242ac120005"
      name:
        type: string
        example: "iPhone 15 Pro"
      description:
        type: string
        example: "Latest Apple smartphone with titanium build."
      price:
        type: integer
        format: int64
        example: 19999000
      stock:
        type: integer
        example: 50
      status:
        type: string
        enum: [available, out_of_stock, not_available]
        example: available
      shop_id:
        type: string
        format: uuid
        example: "01927e4b-3c8a-7f11-a1b2-0242ac120002"
      shop_name:
        type: string
        example: "Toko Elektronik Jaya"
      categories:
        type: array
        items:
          $ref: "../components/category.yml#/schemas/CategoryResponse"
      images:
        type: array
        items:
          $ref: "#/schemas/ProductImageResponse"
