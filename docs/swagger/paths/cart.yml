carts:
  get:
    operationId: getMyCart
    tags: [Cart]
    summary: Get current user's cart
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Cart fetched successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../openapi.yml#/components/schemas/SuccessResponse"
                - type: object
                  properties:
                    data:
                      $ref: "../components/cart.yml#/schemas/CartResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/ErrorResponse"

  post:
    operationId: addToCart
    tags: [Cart]
    summary: Add item to cart
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/cart.yml#/schemas/AddToCartRequest"
    responses:
      "201":
        description: Item added to cart
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/SuccessResponse"
      "400":
        description: Product unavailable or insufficient stock
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/ErrorResponse"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/ErrorResponse"

cartsId:
  put:
    operationId: updateCartItem
    tags: [Cart]
    summary: Update cart item quantity
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/cart.yml#/schemas/UpdateCartRequest"
    responses:
      "200":
        description: Cart item updated
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/SuccessResponse"
      "403":
        description: Forbidden — not your cart item
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/ErrorResponse"
      "404":
        description: Cart item not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/ErrorResponse"

  delete:
    operationId: removeFromCart
    tags: [Cart]
    summary: Remove item from cart
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Cart item removed
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/SuccessResponse"
      "403":
        description: Forbidden — not your cart item
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/ErrorResponse"
      "404":
        description: Cart item not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yml#/components/schemas/ErrorResponse"
